# Thomas Agent MVP — the two-service deployment (operator + scheduler).
#
# One image, two long-lived processes sharing ONE state volume:
#   - operator:  Telegram poll -> verify -> pipeline -> reply (+ emergency console)
#   - scheduler: the tick loop firing due schedules (analysis, crypto cycle/factory,
#     memory prune). Without this service NOTHING scheduled ever runs — the operator
#     loop does not tick schedules.
#
# Run at most ONE scheduler service per state volume. Concurrent stores are
# cross-process locked (claim_due prevents a double-claim), but the deployment
# contract is a single tick process — parallel crypto workers are out of scope.
#
# Secrets come from the environment (compose reads an optional gitignored `.env`
# next to this file); per-machine governance state is mounted, never baked in. A
# bare checkout with no provisioned state runs the network-free mock loop and
# fails closed on every network capability — see docs/DEPLOYMENT.md.
#
# NOTE: no YAML anchors/merge keys here — the repo's static-integrity validator
# parses every YAML file and does not support the merge tag, so the two services
# spell their shared config out explicitly.

services:
  operator:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-operator
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
      - ${THOMAS_CORE_ACTIVATIONS_DIR:-./THOMAS_CORE/activations}:/app/THOMAS_CORE/activations:ro
      - ${THOMAS_CORE_APPROVALS_DIR:-./THOMAS_CORE/approvals}:/app/THOMAS_CORE/approvals:ro
    # Liveness: the loop's OWN heartbeat, not just a readable state file. `console_cli
    # status` answered while a poll loop was wedged, because it only proves the control
    # state parses. A KILLED runtime still passes — killed is *halted*, not *unhealthy*,
    # and its loop keeps turning; resuming stays the operator's decision, never Docker's.
    healthcheck:
      test: ["CMD", "python", "-m", "runtime.mvp_runtime.heartbeat_cli", "operator"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    command:
      - python
      - -m
      - runtime.mvp_runtime.operator_cli
      - --max-batches
      - "0"
      - --long-poll-seconds
      - "25"
      - --independent-validation
      - auto
    environment:
      # Model provider(s) — ordered failover chain; every member needs its own
      # mounted safety-flag grant or the whole chain fails closed at startup.
      MVP_HOSTED_PROVIDER: ${MVP_HOSTED_PROVIDER:-}
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # OpenRouter: one OpenAI-compatible gateway fronting many vendors' models. Needs its
      # own `openrouter` mounted grant like every provider (the env var alone fails closed).
      # MVP_OPENROUTER_MODEL names the exact model slug — a gateway fronts hundreds, so the
      # runtime must be told which; an unset/stale slug is a 4xx (PROVIDER_TRANSPORT).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MVP_OPENROUTER_MODEL: ${MVP_OPENROUTER_MODEL:-}
      MVP_VALIDATOR_PROVIDER: ${MVP_VALIDATOR_PROVIDER:-}
      # F2 conversational front desk (operator service ONLY — the scheduler holds no
      # conversation). Unset = the deterministic channel, exactly as before. Set = plain
      # text becomes a conversation turn; needs its own mounted grant AND the role active
      # in the registry, or startup fails closed rather than quietly staying deterministic.
      MVP_FRONTDESK_PROVIDER: ${MVP_FRONTDESK_PROVIDER:-}
      # Read-only web search (optional).
      MVP_SEARCH_TOOL: ${MVP_SEARCH_TOOL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # The real Telegram transport additionally needs its mounted grant.
      MVP_OPERATOR_CHANNEL: ${MVP_OPERATOR_CHANNEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

  scheduler:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-scheduler
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
      - ${THOMAS_CORE_ACTIVATIONS_DIR:-./THOMAS_CORE/activations}:/app/THOMAS_CORE/activations:ro
      - ${THOMAS_CORE_APPROVALS_DIR:-./THOMAS_CORE/approvals}:/app/THOMAS_CORE/approvals:ro
    # Same liveness rule as the operator: the tick loop's own heartbeat. A scheduler
    # wedged on a provider call used to report healthy indefinitely.
    healthcheck:
      test: ["CMD", "python", "-m", "runtime.mvp_runtime.heartbeat_cli", "scheduler"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    command:
      - python
      - -m
      - runtime.mvp_runtime.scheduler_cli
      - tick
      - --max-ticks
      - "0"
      - --interval-seconds
      - "30"
    # DEPLOY ORDER: `pipeline-worker` must never be OLDER than this service. Since the Phase 2
    # delegation an `analysis_task` fire forwards a frame carrying `actor_profile`, and a
    # worker built before that key existed refuses the whole frame (ARGUMENT_NOT_ACCEPTED,
    # its key set is closed) — so a scheduler recreated onto a new image while the worker
    # still runs an old one fails every delegated fire. The reverse lags safely: the key is
    # optional, so a new worker serves an old scheduler unchanged.
    #
    # A whole-project `compose up -d` satisfies this by construction. A PARTIAL deploy does
    # not, and partial deploys happen here — sparing the money path while updating the doors
    # is a reasonable thing to want, and it is exactly the shape that breaks this. Verified
    # 2026-08-10 against the running containers: the pre-Phase-2 worker refused an
    # `actor_profile` frame with ARGUMENT_NOT_ACCEPTED.
    environment:
      # The ANALYSIS provider chain and the search tool are deliberately absent
      # (MVP_HOSTED_PROVIDER, OPENROUTER_API_KEY, GOOGLE_AI_STUDIO_API_KEY,
      # MVP_OPENROUTER_MODEL, MVP_SEARCH_TOOL, TAVILY_API_KEY — removed by PR-C of
      # docs/proposals/CREDENTIAL_PLANE_SEPARATION_PHASE2_V0.1.md). Their only consumer here
      # was an `analysis_task` fire, and that now runs in `pipeline-worker`, which holds them.
      # This is the service that also holds the Binance account and order keys, so a model
      # credential it does not use is pure blast radius — the OpenRouter key most of all,
      # since the assistant's own container spends from that same key.
      #
      # The removal is safe only BECAUSE the delegation landed with it: an env-less scheduler
      # that still ran the pipeline in-process would silently produce mock analyses and report
      # them COMPLETED. `scheduler.delegate_analysis_task` has no such fallback — an
      # unreachable worker is a recorded failed fire.
      #
      # `MVP_VALIDATOR_PROVIDER` and `GROQ_API_KEY` are gone too, as of D6 — **this service
      # now holds no model credential of any kind.** Its last two consumers were
      # `crypto_data_review` (D5) and `crypto_propose` (D6), and both delegate their model
      # call to `pipeline-worker` now.
      #
      # The D6 deferral this block used to describe rested on a mistake worth recording, since
      # it is the kind that repeats: the proposer's signature is
      # `propose_strategy_families(snapshot, provider=…)`, from which the proposal concluded
      # that delegating it needed the market frame on the far side — either a second collector
      # (against C9's one-feature-source rule) or a serialized 5-leg snapshot. Reading the body
      # rather than the signature showed `build_proposal_prompt` never touches the snapshot;
      # the frame is used only by the judging half, which invokes no model. So the split needed
      # neither: the family list crosses, the frame stays here, and the verdicts are still
      # computed beside the market data they came from.
      #
      # `test_the_scheduler_selects_no_model_provider_at_all` is what keeps it that way — it
      # reads the whole module, not one branch, so a new model consumer anywhere here fails
      # rather than quietly putting a credential back beside the Binance keys.
      # The six Naver variables (MVP_NAVER_RESEARCH + the Search Ad and API HUB credentials)
      # were forwarded here from #650 until the plane separation's PR-B
      # (docs/proposals/CREDENTIAL_PLANE_SEPARATION_V0.1.md) removed them: `pipeline-worker`
      # is the lane's only holder now. Deliberately absent rather than left "harmlessly" —
      # Compose forwards only what this block names, and MVP_NAVER_RESEARCH is the WHOLE gate
      # (no grant behind it), so a name here plus a value in `.env` would put the ad account's
      # spend-capable signing secret back on the service that also holds the Binance keys.
      # Consequence for the CLI: a `--naver-keywords` run must exec in thomas-pipeline-worker,
      # not here — in this container the brief silently degrades to Mock rows.
      # The weekly ideation schedule (blog lane Phase 3, unbuilt) executes via the worker.
      # Outbound-only: lets the tick loop TELL Thomas when a schedule fails, recovers,
      # or was left overdue while this service was down. Same `telegram` grant and the
      # same registered chat as the operator service — the scheduler never reads
      # inbound messages, so this adds notification, not a second command door.
      #
      # The BOT, though, may differ, and `SCHEDULER_TELEGRAM_BOT_TOKEN` is how. Operator
      # Telegram moved to the assistant (Hermes), which polls its own bot; this service kept
      # the original one. So its notifications were delivered — the API returned ok and the
      # watch marker advanced — into a conversation nobody reads any more. Measured
      # 2026-08-01: bot 8732952898 here against 8950942278 there, same operator account, and
      # a `CRYPTO LIVE ENTRY OPEN` message that arrived in the wrong window.
      #
      # Pointing this at the assistant's bot puts the notifications where the operator is
      # already looking. It is safe **only because this service never calls getUpdates** —
      # two pollers on one bot steal each other's messages, and the comment above is the
      # property that makes this the one service where the swap costs nothing. Do NOT set the
      # same value on `operator`, which does poll.
      #
      # Unset falls back to `TELEGRAM_BOT_TOKEN`, so a machine that has not opted in behaves
      # exactly as before.
      MVP_OPERATOR_CHANNEL: ${MVP_OPERATOR_CHANNEL:-}
      TELEGRAM_BOT_TOKEN: ${SCHEDULER_TELEGRAM_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      # Crypto pipeline gates (scheduler-only): the env var alone fails closed —
      # each real backend also needs its mounted safety-flag grant.
      MVP_MARKET_DATA: ${MVP_MARKET_DATA:-}
      MVP_PAPER_TRADING: ${MVP_PAPER_TRADING:-}
      MVP_LIQUIDATION_FEED: ${MVP_LIQUIDATION_FEED:-}
      COINALYZE_API_KEY: ${COINALYZE_API_KEY:-}
      # The candle archive's own axis, and it has to be its own: MVP_MARKET_DATA names the
      # single venue the PIPELINE collects from, so pointing that at Hyperliquid to start
      # archiving would take the crypto pipeline off Binance — including the leg that can
      # place a real order. Unlike its neighbours above, this one needs no grant: Thomas
      # moved it to the env-only gate on 2026-08-04 (#496), because a 30-day TTL cannot
      # bound a job that races a rolling window for months. So THIS line is the whole gate,
      # which is exactly why forgetting it is the failure it was: the code shipped in #486
      # and this block did not name the variable, so setting it in `.env` reached nothing
      # and archiving would have stayed silently off while reading as configured.
      MVP_CANDLE_ARCHIVE: ${MVP_CANDLE_ARCHIVE:-}
      # Five prediction-market selectors (Kalshi / Polymarket / Binance, plus that venue's
      # signed key pair) were forwarded here until 2026-08-02, when the lane was removed —
      # `docs/BUILD_HISTORY.md`. Deliberately NOT left in place "harmlessly": Compose
      # forwards only what this block names, so a name here is the whole difference between
      # a key in `.env` reaching the container and reaching nothing. Leaving them would keep
      # a door wired to a room that no longer exists, and the next person to find a stale
      # `MVP_KALSHI_MARKET_DATA` in `.env` would have no way to tell it was inert.
      # Live-trading and account variables (scheduler-only). Thomas decision, 2026-07-27:
      # forwarded from `.env` so the readiness board and the account read answer on the
      # service without an operator exporting them per session.
      #
      # This reverses the earlier posture, and the reason that posture existed is kept visible
      # rather than deleted: these credentials now live in a service that restarts on its own
      # (`restart: unless-stopped`), so they outlast the session that set them and are readable
      # by anything that can inspect the container. It is ONE Binance key — the order
      # credentials are derived from the account ones — so `account.py` being read-only by
      # construction is a property of this code, not of a key that carries futures-trading
      # permission at the venue.
      #
      # !! This block used to end "Env alone opens nothing." It no longer does. Two changes on
      # 2026-07-28 cut the same way: cycle routing shipped, so a SCHEDULED run reaches the order
      # path (through exactly one module, pinned by a test); and Thomas removed the per-machine
      # `live_trading` grant, making MVP_LIVE_TRADING=real the entire gate. The `.env` this
      # block reads is now by itself the difference between a scheduler that trades paper and
      # one that trades real money. Forwarding is a capability here, not just a cost.
      #
      # What still stands between here and an autonomous order: the confirmation phrase, the
      # registered budget, the canary evidence, both kill switches, and the loss breaker - each
      # a computed row on `python -m runtime.mvp_runtime.crypto.live_readiness`.
      #
      # To halt a scheduler that is trading: `console_cli kill`. Do NOT clear MVP_LIVE_TRADING -
      # it only takes effect on restart, and the close guard needs it, so it strands positions.
      MVP_ACCOUNT_FEED: ${MVP_ACCOUNT_FEED:-}
      BINANCE_ACCOUNT_API_KEY: ${BINANCE_ACCOUNT_API_KEY:-}
      BINANCE_ACCOUNT_API_SECRET: ${BINANCE_ACCOUNT_API_SECRET:-}
      MVP_LIVE_TRADING: ${MVP_LIVE_TRADING:-}
      MVP_LIVE_ORDER_API_KEY: ${MVP_LIVE_ORDER_API_KEY:-}
      MVP_LIVE_ORDER_API_SECRET: ${MVP_LIVE_ORDER_API_SECRET:-}
      MVP_LIVE_CONFIRMATION: ${MVP_LIVE_CONFIRMATION:-}
      MVP_LIVE_CANARY_CONFIRMATION: ${MVP_LIVE_CANARY_CONFIRMATION:-}

  # The read-only door. Same shape as `switch-bridge` and deliberately a second service:
  # different authority (INTERNAL_READ + kill_allows read_only_status, not the emergency
  # grant), and a read that wedges must not be able to wedge the stop path — which is the
  # one that matters when something is going wrong.
  #
  # `runtime/mvp_runtime/read_bridge.py` dispatches every verb to the SAME applier the
  # Telegram channel uses, so an answer here cannot disagree with `/crypto status`. Nothing
  # it serves can mutate: registry CANCEL and memory PROMOTE are absent from its table and a
  # test asserts they stay absent.
  #
  # Same absent env as the switch door — no provider keys, no venue keys, no MVP_LIVE_*.
  read-bridge:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-read-bridge
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
    healthcheck:
      test: ["CMD", "test", "-S", "/app/.runtime_governance_state/bridge/read.sock"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - python
      - -m
      - runtime.mvp_runtime.read_bridge_cli
    # The assistant's gid. The door hands its socket and the bridge directory to this group,
    # so who may reach a door is stated by the door instead of inherited from whatever gid it
    # happens to run as. `group_add` is what lets a non-root door chgrp to it: POSIX allows an
    # owner to set a file's group only to a group it belongs to.
    #
    # These services run their server as PID 1 with no in-container privilege drop, so the
    # supplementary group survives. That is exactly what failed on the assistant's side, where
    # `s6-setuidgid` recomputed groups from /etc/group and silently discarded `group_add` —
    # leaving three doors up and unreachable with nothing on either side saying why.
    group_add:
      - "${MVP_BRIDGE_CLIENT_GID:-10000}"
    environment:
      MVP_BRIDGE_CLIENT_GID: ${MVP_BRIDGE_CLIENT_GID:-10000}
      # Optional second gate, on the peer's uid rather than its group. The socket's mode
      # grants a GROUP, so every process in that group looks identical to `chmod` and
      # different to SO_PEERCRED, which the kernel records at connect() and no frame can
      # choose. Unset (the default) leaves the group as the whole check, exactly as before
      # this existed; set it to the assistant's uid, comma-separated with the operator's if
      # a shell needs to reach the door too. A value the door cannot check refuses to serve
      # rather than serving unchecked. See `resolve_client_uids` in
      # runtime/mvp_runtime/socket_door.py.
      MVP_BRIDGE_CLIENT_UID: ${MVP_BRIDGE_CLIENT_UID:-}

  # The dispatch door. The assistant's third lane: switch-bridge stops and starts the runtime, read-bridge
  # looks at it, this one *starts* bounded work — analysis/research/translation/content tasks
  # that run the ordinary pipeline at permission P3. `runtime/mvp_runtime/dispatch_bridge.py`
  # caps this in code: a closed set of non-trading request kinds, no `write_path`, the kill
  # switch checked before every dispatch, every task attributed to `assistant_bridge`. A test
  # asserts the kind set stays those four and that none of them reaches the money path.
  #
  # Since the plane separation (docs/proposals/CREDENTIAL_PLANE_SEPARATION_V0.1.md, Thomas
  # 2026-08-10) this door VALIDATES AND FORWARDS; execution lives in `pipeline-worker` below,
  # reached over an internal socket the assistant's container cannot traverse to. So this
  # service carries the same environment as the read and switch doors — the two peer variables
  # and nothing else. No provider key, no search key, no Naver variable: the process that
  # parses the assistant's frames holds no credential, which is the point of the split. And as
  # always no money variable — no BINANCE_*, no MVP_LIVE_*, no venue or order key.
  #
  # No Core mounts either: binding a Task needs them and binding happens in the worker now,
  # so the #380 failure signature (BRIDGE_ERROR on a missing THOMAS_CORE path) moved with it —
  # if a dispatch fails that way, look at thomas-pipeline-worker's mounts, not this service's.
  dispatch-bridge:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-dispatch-bridge
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
    healthcheck:
      test: ["CMD", "test", "-S", "/app/.runtime_governance_state/bridge/dispatch.sock"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - python
      - -m
      - runtime.mvp_runtime.dispatch_bridge_cli
    group_add:
      - "${MVP_BRIDGE_CLIENT_GID:-10000}"
    environment:
      # See read-bridge for why the door states the client gid rather than inheriting it.
      MVP_BRIDGE_CLIENT_GID: ${MVP_BRIDGE_CLIENT_GID:-10000}
      # See read-bridge for the uid gate this leaves unset by default.
      MVP_BRIDGE_CLIENT_UID: ${MVP_BRIDGE_CLIENT_UID:-}

  # The dispatch door's engine (docs/proposals/CREDENTIAL_PLANE_SEPARATION_V0.1.md). This is
  # the process that runs `pipeline.run_task` for the four P3 kinds, so it is where the
  # credential env lives: the model provider chain, the search key, and the Naver lane's
  # variables. Each provider still needs its mounted safety-flag grant (via the state volume) —
  # the env var alone fails closed. Deliberately absent: everything from the money path — no
  # BINANCE_*, no MVP_LIVE_*, no venue or order key; the kinds this worker runs never reach it,
  # and `test_deployment_env_passthrough` pins that per variable. NB: OPENROUTER_API_KEY is
  # shared with the operator's assistant, so assistant-dispatched spend rides the same
  # free-tier quota — the assistant_dispatch spend alert ($50/day) is what watches it.
  #
  # This is NOT an assistant door, and its socket is deliberately not in `bridge/`: that
  # directory is group-owned by the assistant's gid and mounted into the assistant's
  # container, and an engine socket there would be reachable past every cap the door
  # enforces. It lives under `internal/` instead, and the two literals below pin its peers to
  # the runtime's own uid/gid (10001, the image's fixed user) — the dispatch door is this
  # socket's only legitimate client, and SO_PEERCRED is what refuses everything else. The
  # worker refuses to listen at all without a uid allowlist. Literals, not ${...}
  # interpolations, so a host `.env` that points the doors' gid at the assistant cannot also
  # point the engine's peers anywhere.
  pipeline-worker:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-pipeline-worker
    restart: unless-stopped
    # A model run in flight deserves the operator/scheduler grace, not the doors' 10s: a
    # SIGTERM mid-analysis should let the task settle into the ledger where it can.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
      # The pipeline will not bind a task without an active approved Core — the Core mounts
      # moved here from dispatch-bridge with the execution itself (#380's gotcha, relocated:
      # a BRIDGE_ERROR naming a THOMAS_CORE path means THESE mounts were dropped).
      - ${THOMAS_CORE_ACTIVATIONS_DIR:-./THOMAS_CORE/activations}:/app/THOMAS_CORE/activations:ro
      - ${THOMAS_CORE_APPROVALS_DIR:-./THOMAS_CORE/approvals}:/app/THOMAS_CORE/approvals:ro
    healthcheck:
      test: ["CMD", "test", "-S", "/app/.runtime_governance_state/internal/pipeline.sock"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - python
      - -m
      - runtime.mvp_runtime.pipeline_worker_cli
    environment:
      # The engine's peers are the runtime itself — see the header comment for why these are
      # literals. No group_add: the socket's group is the process's own.
      MVP_BRIDGE_CLIENT_GID: "10001"
      MVP_BRIDGE_CLIENT_UID: "10001"
      # Model providers and search, moved verbatim from dispatch-bridge with the execution.
      MVP_HOSTED_PROVIDER: ${MVP_HOSTED_PROVIDER:-}
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MVP_OPENROUTER_MODEL: ${MVP_OPENROUTER_MODEL:-}
      MVP_VALIDATOR_PROVIDER: ${MVP_VALIDATOR_PROVIDER:-}
      # Read-only web search (optional), same Safety-Flag Gate.
      MVP_SEARCH_TOOL: ${MVP_SEARCH_TOOL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Naver keyword research for the blog content lane (optional). The `research`/`content`
      # kinds run HERE now, so this service is where the lane's credentials belong — and after
      # PR-B removes the scheduler's copy, the only place they exist at all.
      #
      # Unlike every other gate in this block, MVP_NAVER_RESEARCH is the WHOLE gate: there is
      # no mounted grant behind it (Thomas, 2026-08-09). Naming it here is therefore an
      # enablement path, not merely a passthrough, and the credentials below are what it
      # enables. The Search Ad secret signs against the AD ACCOUNT and reaches
      # campaign-management endpoints — it is not the read-only key its read-only use makes it
      # look like, which is why no assistant-facing service is given these.
      MVP_NAVER_RESEARCH: ${MVP_NAVER_RESEARCH:-}
      NAVER_SEARCHAD_CUSTOMER_ID: ${NAVER_SEARCHAD_CUSTOMER_ID:-}
      NAVER_SEARCHAD_API_KEY: ${NAVER_SEARCHAD_API_KEY:-}
      NAVER_SEARCHAD_SECRET_KEY: ${NAVER_SEARCHAD_SECRET_KEY:-}
      NAVER_APIHUB_KEY_ID: ${NAVER_APIHUB_KEY_ID:-}
      NAVER_APIHUB_KEY: ${NAVER_APIHUB_KEY:-}

  # The knowledge door (K1). The assistant's fourth lane, and the first that ACCUMULATES:
  # switch-bridge stops and starts, read-bridge looks, dispatch-bridge starts bounded work
  # that ends — this one takes a document in and keeps it, then answers questions from what it
  # has kept. `runtime/mvp_runtime/knowledge_bridge.py` carries three verbs and no more:
  # add_document (append), query and stats (reads). No delete, no edit, and no verb that names
  # a path on the runtime's filesystem — a document arrives as content in the frame or it does
  # not arrive.
  #
  # Its own service for this door's specific failure: an ingest runs `pdftotext` as a
  # subprocess and re-indexes the corpus, so it is by far the most expensive request the
  # deployment serves, and a wedged ingest must not be able to wedge the stop path.
  #
  # Authority split, enforced in that module and asserted by a test: add_document is a write
  # and refuses while PAUSED/KILLED; query and stats are reads and keep answering, per
  # `kill_allows: [read_only_status, audit_read]` — an incident is when the record is most
  # worth reading.
  #
  # No Core mounts: this door binds no Task and runs no pipeline. No provider keys, no search
  # keys, no money variables — retrieval here is BM25 over a local index, so there is no
  # network capability for a key to enable and nothing for one to spend.
  knowledge-bridge:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-knowledge-bridge
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
    healthcheck:
      test: ["CMD", "test", "-S", "/app/.runtime_governance_state/bridge/knowledge.sock"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - python
      - -m
      - runtime.mvp_runtime.knowledge_bridge_cli
    group_add:
      - "${MVP_BRIDGE_CLIENT_GID:-10000}"
    environment:
      # See read-bridge for why the door states the client gid rather than inheriting it.
      MVP_BRIDGE_CLIENT_GID: ${MVP_BRIDGE_CLIENT_GID:-10000}
      # See read-bridge for the uid gate this leaves unset by default.
      MVP_BRIDGE_CLIENT_UID: ${MVP_BRIDGE_CLIENT_UID:-}

  # The trading-switch door. Same shape as the others and deliberately its own service, for
  # the reason the halt door had: the scheduler is what a stop is meant to stop, so a door
  # living inside it stops answering exactly when it is needed.
  #
  # This is the first door that can START trading, and the asymmetry lives in
  # `runtime/mvp_runtime/switch_bridge.py`, not here: `disable` applies immediately, `enable`
  # only creates an APPROVAL_REQUIRED ask and cannot act until Thomas answers it on the
  # verified control channel. It reaches `control.CMD_RESUME` through exactly one path — a
  # single-use grant whose approved snapshot names the domain.
  #
  # It needs the Core mounts. `enable` binds its ask to a Task + Core Binding like every other
  # approval request, and a bridge without an active approved Core fails BRIDGE_ERROR on the
  # missing activation file — the exact way the dispatch door broke when its mounts were
  # dropped (#380). If this door ever fails on a THOMAS_CORE path, look here first.
  #
  # Where to look, since that reply no longer carries the path: BRIDGE_ERROR is now a fixed
  # sentence plus an `error_ref`, and the traceback naming the file goes to this service's log
  # under the same ref (`docker logs thomas-switch-bridge | grep <ref>`). The reason_code did
  # NOT change, so the signature above still greps. What changed is that the assistant — which
  # reads untrusted text — no longer gets the runtime's file layout in an error string.
  #
  # Same absent env as the read and dispatch doors: no provider keys, no venue keys, no MVP_LIVE_*.
  # Flipping the control switch reads and writes control state; it reaches no venue and no
  # model. The live gate (MVP_LIVE_TRADING) is a DEPLOY action and this door never touches it —
  # clearing it needs a restart and shuts the close path, stranding open positions.
  switch-bridge:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-switch-bridge
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
      - ${THOMAS_CORE_ACTIVATIONS_DIR:-./THOMAS_CORE/activations}:/app/THOMAS_CORE/activations:ro
      - ${THOMAS_CORE_APPROVALS_DIR:-./THOMAS_CORE/approvals}:/app/THOMAS_CORE/approvals:ro
    healthcheck:
      test: ["CMD", "test", "-S", "/app/.runtime_governance_state/bridge/switch.sock"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - python
      - -m
      - runtime.mvp_runtime.switch_bridge_cli
    # The assistant's gid. The door hands its socket and the bridge directory to this group,
    # so who may reach a door is stated by the door instead of inherited from whatever gid it
    # happens to run as. `group_add` is what lets a non-root door chgrp to it: POSIX allows an
    # owner to set a file's group only to a group it belongs to.
    #
    # These services run their server as PID 1 with no in-container privilege drop, so the
    # supplementary group survives. That is exactly what failed on the assistant's side, where
    # `s6-setuidgid` recomputed groups from /etc/group and silently discarded `group_add` —
    # leaving three doors up and unreachable with nothing on either side saying why.
    group_add:
      - "${MVP_BRIDGE_CLIENT_GID:-10000}"
    environment:
      MVP_BRIDGE_CLIENT_GID: ${MVP_BRIDGE_CLIENT_GID:-10000}
      # See read-bridge for the uid gate this leaves unset by default.
      MVP_BRIDGE_CLIENT_UID: ${MVP_BRIDGE_CLIENT_UID:-}
