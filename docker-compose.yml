# Thomas Agent MVP — the deployment (operator + the two scheduler lanes).
#
# One image, long-lived processes sharing ONE state volume:
#   - operator:        Telegram poll -> verify -> pipeline -> reply (+ emergency console)
#   - scheduler:       the RISK-lane tick loop (crypto_pipeline / breaker / route watch —
#     the money path's cadence). `--lane risk` fires RISK_KINDS and nothing else.
#   - scheduler-maint: the MAINTENANCE-lane tick loop (factory, null_control, archive,
#     analysis, prune, rotate, report, propose, data review). Split so that no fire of any
#     kind can stand in front of a due risk kind — the factory child (#726) moved compute
#     out of the pass and the very next day the pipeline was still 1,181s late behind the
#     in-pass fetch; a lane is the class fix (docs/proposals/SCHEDULER_LANE_SPLIT_V0.1.md).
#   Without a scheduler lane NOTHING its kinds schedule ever runs — the operator loop does
#   not tick schedules, and each lane leaves the other lane's schedules strictly alone.
#
# Run at most ONE tick service PER LANE per state volume. Concurrent stores are
# cross-process locked (claim_due prevents a double-claim) and the lanes' kind sets are
# disjoint by construction, but the deployment contract is one process per lane —
# parallel crypto workers are out of scope.
#
# DEPLOY COUPLING (lane split): `--lane` exists only from #733 on. This compose file with
# an OLDER image crash-loops both lanes on an unknown flag — so never `compose up -d` after
# merging this without first promoting an image that carries #733. The safe order is the
# candidate-tag flow in CLAUDE.md: build+verify+promote `latest`, then `compose up -d`.
#
# Secrets come from the environment (compose reads an optional gitignored `.env`
# next to this file); per-machine governance state is mounted, never baked in. A
# bare checkout with no provisioned state runs the network-free mock loop and
# fails closed on every network capability — see docs/DEPLOYMENT.md.
#
# NOTE: no YAML anchors/merge keys here — the repo's static-integrity validator
# parses every YAML file and does not support the merge tag, so the two services
# spell their shared config out explicitly.

services:
  operator:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-operator
    restart: unless-stopped
    stop_grace_period: 30s
    # Memory ceiling (Thomas decision Q15-b, 2026-09-03; PR5). The two scheduler lanes stay unlimited —
    # the money path is what the kernel's OOM killer must never pick — so every OTHER long-lived
    # process on this 3.8 GB host carries a ceiling and is the candidate instead. Idle footprint is
    # ~1–10 MB; the ceiling is sized for a model call plus a Naver research pass, not for idle.
    mem_limit: 512m
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
      - ${THOMAS_CORE_ACTIVATIONS_DIR:-./THOMAS_CORE/activations}:/app/THOMAS_CORE/activations:ro
      - ${THOMAS_CORE_APPROVALS_DIR:-./THOMAS_CORE/approvals}:/app/THOMAS_CORE/approvals:ro
    # Liveness: the loop's OWN heartbeat, not just a readable state file. `console_cli
    # status` answered while a poll loop was wedged, because it only proves the control
    # state parses. A KILLED runtime still passes — killed is *halted*, not *unhealthy*,
    # and its loop keeps turning; resuming stays the operator's decision, never Docker's.
    healthcheck:
      test: ["CMD", "python", "-m", "runtime.mvp_runtime.heartbeat_cli", "operator"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    command:
      - python
      - -m
      - runtime.mvp_runtime.operator_cli
      - --max-batches
      - "0"
      - --long-poll-seconds
      - "25"
      - --independent-validation
      - auto
      # M3, ON since 2026-08-24 — the same flag its worker now carries. The reviewer decides
      # a run is not good enough; without this nothing acts on that verdict.
      - --revise
    environment:
      # Model provider(s) — ordered failover chain. Naming a member IS its opt-in (the env-only
      # gate, Thomas 2026-08-10; per-machine grants are retired); an unknown or duplicate member
      # fails the whole chain closed at startup.
      MVP_HOSTED_PROVIDER: ${MVP_HOSTED_PROVIDER:-}
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # OpenRouter: one OpenAI-compatible gateway fronting many vendors' models. Naming it in
      # MVP_HOSTED_PROVIDER is its whole opt-in, like every provider (the env-only gate above).
      # MVP_OPENROUTER_MODEL names the exact model slug — a gateway fronts hundreds, so the
      # runtime must be told which; an unset/stale slug is a 4xx (PROVIDER_TRANSPORT).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MVP_OPENROUTER_MODEL: ${MVP_OPENROUTER_MODEL:-}
      # The other two vendors' model slugs, same contract as MVP_OPENROUTER_MODEL: unset
      # falls back to the code default. Wired through 2026-08-30 because until then only
      # the OpenRouter slug reached the services — when Groq decommissioned the code
      # default (#790) the only fix was a rebuild, and when gemini-flash-latest sat at 503
      # there was no per-machine override at all. A vendor retiring a model is an .env
      # edit now, not an image.
      #
      # "Unset falls back to the code default" was FALSE for nine days and is true again.
      # `${VAR:-}` does not omit an unset key, it forwards it EMPTY, and the code read these
      # with `os.environ.get(name, DEFAULT)` — which defaults only on an ABSENT key. So the
      # slug resolved to "", Groq answered every call HTTP 404, and this passthrough silently
      # un-did #790 the morning after it shipped. The repair is in the reader, not here
      # (`providers._slug_from_env`): the form below is right, and an empty value must mean
      # unset for a slug exactly as it already means inert for a selector.
      MVP_GROQ_MODEL: ${MVP_GROQ_MODEL:-}
      MVP_HOSTED_MODEL: ${MVP_HOSTED_MODEL:-}
      MVP_VALIDATOR_PROVIDER: ${MVP_VALIDATOR_PROVIDER:-}
      # F2 conversational front desk (operator service ONLY — the scheduler holds no
      # conversation). Unset = the deterministic channel, exactly as before. Set = plain
      # text becomes a conversation turn; the env var is the opt-in (env-only gate, 2026-08-10)
      # and the role must be active in the registry, or startup fails closed rather than quietly
      # staying deterministic.
      MVP_FRONTDESK_PROVIDER: ${MVP_FRONTDESK_PROVIDER:-}
      # Read-only web search (optional).
      MVP_SEARCH_TOOL: ${MVP_SEARCH_TOOL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # MVP_OPERATOR_CHANNEL=telegram is the real transport's whole opt-in (env-only gate).
      MVP_OPERATOR_CHANNEL: ${MVP_OPERATOR_CHANNEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # No HERMES_BOT_TOKEN since 2026-10-25: it carried the approval mirror (switch-door asks copied
      # into the assistant's window), which left with the switch door.

  scheduler:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-scheduler
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
      - ${THOMAS_CORE_ACTIVATIONS_DIR:-./THOMAS_CORE/activations}:/app/THOMAS_CORE/activations:ro
      - ${THOMAS_CORE_APPROVALS_DIR:-./THOMAS_CORE/approvals}:/app/THOMAS_CORE/approvals:ro
    # Same liveness rule as the operator: the tick loop's own heartbeat. A scheduler
    # wedged on a provider call used to report healthy indefinitely. The probe names the
    # LANE's heartbeat — each lane stamps its own file, because a shared one would let a
    # live maintenance loop keep a dead risk loop reading FRESH.
    healthcheck:
      test: ["CMD", "python", "-m", "runtime.mvp_runtime.heartbeat_cli", "scheduler-risk"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    # `--lane risk`: this service — the one holding the venue keys — fires RISK_KINDS and
    # nothing else. Its name, env, and mounts deliberately did not move in the lane split:
    # the money path stays put, the maintenance kinds moved out (scheduler-maint below).
    command:
      - python
      - -m
      - runtime.mvp_runtime.scheduler_cli
      - tick
      - --lane
      - risk
      - --max-ticks
      - "0"
      - --interval-seconds
      - "30"
    # DEPLOY ORDER: `pipeline-worker` must never be OLDER than this service. Since the Phase 2
    # delegation an `analysis_task` fire forwards a frame carrying `actor_profile`, and a
    # worker built before that key existed refuses the whole frame (ARGUMENT_NOT_ACCEPTED,
    # its key set is closed) — so a scheduler recreated onto a new image while the worker
    # still runs an old one fails every delegated fire. The reverse lags safely: the key is
    # optional, so a new worker serves an old scheduler unchanged.
    #
    # A whole-project `compose up -d` satisfies this by construction. A PARTIAL deploy does
    # not, and partial deploys happen here — sparing the money path while updating the doors
    # is a reasonable thing to want, and it is exactly the shape that breaks this. Verified
    # 2026-08-10 against the running containers: the pre-Phase-2 worker refused an
    # `actor_profile` frame with ARGUMENT_NOT_ACCEPTED.
    environment:
      # The ANALYSIS provider chain and the search tool are deliberately absent
      # (MVP_HOSTED_PROVIDER, OPENROUTER_API_KEY, GOOGLE_AI_STUDIO_API_KEY,
      # MVP_OPENROUTER_MODEL, MVP_SEARCH_TOOL, TAVILY_API_KEY — removed by PR-C of
      # docs/proposals/CREDENTIAL_PLANE_SEPARATION_PHASE2_V0.1.md). Their only consumer here
      # was an `analysis_task` fire, and that now runs in `pipeline-worker`, which holds them.
      # This is the service that also holds the Binance account and order keys, so a model
      # credential it does not use is pure blast radius — the OpenRouter key most of all,
      # which the model plane spends from.
      #
      # The removal is safe only BECAUSE the delegation landed with it: an env-less scheduler
      # that still ran the pipeline in-process would silently produce mock analyses and report
      # them COMPLETED. `scheduler.delegate_analysis_task` has no such fallback — an
      # unreachable worker is a recorded failed fire.
      #
      # `MVP_VALIDATOR_PROVIDER` and `GROQ_API_KEY` are gone too, as of D6 — **this service
      # now holds no model credential of any kind.** Its last two consumers were
      # `crypto_data_review` (D5) and `crypto_propose` (D6), and both delegate their model
      # call to `pipeline-worker` now.
      #
      # The D6 deferral this block used to describe rested on a mistake worth recording, since
      # it is the kind that repeats: the proposer's signature is
      # `propose_strategy_families(snapshot, provider=…)`, from which the proposal concluded
      # that delegating it needed the market frame on the far side — either a second collector
      # (against C9's one-feature-source rule) or a serialized 5-leg snapshot. Reading the body
      # rather than the signature showed `build_proposal_prompt` never touches the snapshot;
      # the frame is used only by the judging half, which invokes no model. So the split needed
      # neither: the family list crosses, the frame stays here, and the verdicts are still
      # computed beside the market data they came from.
      #
      # `test_the_scheduler_selects_no_model_provider_at_all` is what keeps it that way — it
      # reads the whole module, not one branch, so a new model consumer anywhere here fails
      # rather than quietly putting a credential back beside the Binance keys.
      # The six Naver variables (MVP_NAVER_RESEARCH + the Search Ad and API HUB credentials)
      # were forwarded here from #650 until the plane separation's PR-B
      # (docs/proposals/CREDENTIAL_PLANE_SEPARATION_V0.1.md) removed them: `pipeline-worker`
      # is the lane's only holder now. Deliberately absent rather than left "harmlessly" —
      # Compose forwards only what this block names, and MVP_NAVER_RESEARCH is the WHOLE gate
      # (no grant behind it), so a name here plus a value in `.env` would put the ad account's
      # spend-capable signing secret back on the service that also holds the Binance keys.
      # Consequence for the CLI: a `--naver-keywords` run must exec in thomas-pipeline-worker,
      # not here — in this container the brief silently degrades to Mock rows.
      # Outbound-only: lets the tick loop TELL Thomas when a schedule fails, recovers,
      # or was left overdue while this service was down. Same `telegram` opt-in and the
      # same registered chat as the operator service — the scheduler never reads
      # inbound messages, so this adds notification, not a second command door.
      #
      # The BOT, though, may differ, and `HERMES_BOT_TOKEN` is how — the assistant's bot token,
      # held ONCE in `.env` (the single secret source since PR2, 2026-09-04; the variable was
      # `SCHEDULER_TELEGRAM_BOT_TOKEN` before, a second copy of a token the assistant's own
      # env file also held) and projected only to the services that SEND on it. Operator
      # Telegram moved to the assistant (Hermes), which polls its own bot; this service kept
      # the original one. So its notifications were delivered — the API returned ok and the
      # watch marker advanced — into a conversation nobody reads any more. Measured
      # 2026-08-01: bot 8732952898 here against 8950942278 there, same operator account, and
      # a `CRYPTO LIVE ENTRY OPEN` message that arrived in the wrong window.
      #
      # Pointing this at the assistant's bot puts the notifications where the operator is
      # already looking. It is safe **only because this service never calls getUpdates** —
      # two pollers on one bot steal each other's messages, and the comment above is the
      # property that makes this the one service where the swap costs nothing. Do NOT set the
      # same value on `operator`, which does poll.
      #
      # Since the assistant's container was retired (Thomas 2026-10-25) the bot has NO poller:
      # it is a send-only notification window, and the control bot stays the one inbound door.
      #
      # Unset falls back to `TELEGRAM_BOT_TOKEN`, so a machine that has not opted in behaves
      # exactly as before.
      MVP_OPERATOR_CHANNEL: ${MVP_OPERATOR_CHANNEL:-}
      TELEGRAM_BOT_TOKEN: ${HERMES_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      # Crypto pipeline gates (scheduler-only): each var is its backend's whole opt-in (the
      # env-only gate, Thomas 2026-08-10; the per-machine safety-flag grants are retired).
      MVP_MARKET_DATA: ${MVP_MARKET_DATA:-}
      MVP_PAPER_TRADING: ${MVP_PAPER_TRADING:-}
      MVP_LIQUIDATION_FEED: ${MVP_LIQUIDATION_FEED:-}
      COINALYZE_API_KEY: ${COINALYZE_API_KEY:-}
      # MVP_CANDLE_ARCHIVE moved to `scheduler-maint` with the lane split: the archive fire
      # is a MAINTENANCE kind, so this lane has no consumer for it — and this block's own
      # doctrine is that an unconsumed name here is pure blast radius, not a convenience.
      # Deliberately absent rather than left "harmlessly"; the drift gate
      # (`tests/test_deployment_env_passthrough.py`) pins the move in both directions.
      # Five prediction-market selectors (Kalshi / Polymarket / Binance, plus that venue's
      # signed key pair) were forwarded here until 2026-08-02, when the lane was removed —
      # `docs/BUILD_HISTORY.md`. Deliberately NOT left in place "harmlessly": Compose
      # forwards only what this block names, so a name here is the whole difference between
      # a key in `.env` reaching the container and reaching nothing. Leaving them would keep
      # a door wired to a room that no longer exists, and the next person to find a stale
      # `MVP_KALSHI_MARKET_DATA` in `.env` would have no way to tell it was inert.
      # Live-trading and account variables (scheduler-only). Thomas decision, 2026-07-27:
      # forwarded from `.env` so the readiness board and the account read answer on the
      # service without an operator exporting them per session.
      #
      # This reverses the earlier posture, and the reason that posture existed is kept visible
      # rather than deleted: these credentials now live in a service that restarts on its own
      # (`restart: unless-stopped`), so they outlast the session that set them and are readable
      # by anything that can inspect the container. It is ONE Binance key — the order
      # credentials are derived from the account ones — so `account.py` being read-only by
      # construction is a property of this code, not of a key that carries futures-trading
      # permission at the venue.
      #
      # !! This block used to end "Env alone opens nothing." It no longer does. Two changes on
      # 2026-07-28 cut the same way: cycle routing shipped, so a SCHEDULED run reaches the order
      # path (through exactly one module, pinned by a test); and Thomas removed the per-machine
      # `live_trading` grant, making MVP_LIVE_TRADING=real the entire gate. The `.env` this
      # block reads is now by itself the difference between a scheduler that trades paper and
      # one that trades real money. Forwarding is a capability here, not just a cost.
      #
      # What still stands between here and an autonomous order: the confirmation phrase, the
      # registered budget, both kill switches, and the loss breaker - each a computed row on
      # `python -m runtime.mvp_runtime.crypto.live_readiness`. The canary evidence stood here
      # until 2026-09-15 (PR1r); nothing replaces it until PR1b enforces the execution stage.
      #
      # To stop new entries and keep managing positions: `console_cli halt_trading` (policy 1.5.1).
      # `console_cli kill` stops position management too. Do NOT clear MVP_LIVE_TRADING -
      # it only takes effect on restart, and the close guard needs it, so it strands positions.
      MVP_ACCOUNT_FEED: ${MVP_ACCOUNT_FEED:-}
      BINANCE_ACCOUNT_API_KEY: ${BINANCE_ACCOUNT_API_KEY:-}
      BINANCE_ACCOUNT_API_SECRET: ${BINANCE_ACCOUNT_API_SECRET:-}
      # H1-b (Thomas 2026-10-08): the dedicated venue READ-ONLY key ("Enable Reading" only). The account
      # feed signs observation with it — the scheduled account snapshot, the dashboard, the readiness
      # board, the resting-orders board — so closing MVP_LIVE_TRADING does not blind them. The pair
      # above stays for the write plane's own reads (live leg, emergency close, probe). Read availability
      # is not execution permission, and nothing falls back from this pair to that one.
      #
      # This lane therefore holds the read key AND the trading keys, because the snapshot refresh rides a
      # risk-lane fire. Separation candidate (recorded, not done): move the snapshot refresh and the
      # resting-orders read to a maintenance kind on scheduler-maint (or a reader service), leaving this
      # lane with the trading keys only. scheduler-maint also receives this pair since the wallet
      # activation (Thomas 2026-10-08, after H2-H4); no other service does.
      BINANCE_READ_API_KEY: ${BINANCE_READ_API_KEY:-}
      BINANCE_READ_API_SECRET: ${BINANCE_READ_API_SECRET:-}
      MVP_LIVE_TRADING: ${MVP_LIVE_TRADING:-}
      MVP_LIVE_ORDER_API_KEY: ${MVP_LIVE_ORDER_API_KEY:-}
      MVP_LIVE_ORDER_API_SECRET: ${MVP_LIVE_ORDER_API_SECRET:-}
      MVP_LIVE_CONFIRMATION: ${MVP_LIVE_CONFIRMATION:-}
      MVP_LIVE_CANARY_CONFIRMATION: ${MVP_LIVE_CANARY_CONFIRMATION:-}
      # The softer halt (Thomas decision 2026-09-07). The comment above has claimed "both kill
      # switches" since this block was written, and for that whole time this one reached no
      # service: the runbook's "set it and restart" did nothing on the very service the
      # autonomous entry path runs on. Forwarded now so the documented control exists where it
      # is documented to. Empty is the inert path (`_env_bool` reads absent and "" alike as
      # not engaged), so this line arms nothing by itself. It does NOT replace `console_cli
      # kill`, which remains the halt to reach for first because it lands on the RUNNING
      # scheduler at its next guard; this one needs a restart to take effect.
      MVP_LIVE_MANUAL_KILL_SWITCH: ${MVP_LIVE_MANUAL_KILL_SWITCH:-}

      # The signed testnet path (2026-09-16, PR1d-1): its own switch and its own key pair, so a
      # testnet order can be placed and reconciled without the live switch or the live key.
      MVP_TESTNET_TRADING: ${MVP_TESTNET_TRADING:-}
      MVP_TESTNET_ORDER_API_KEY: ${MVP_TESTNET_ORDER_API_KEY:-}
      MVP_TESTNET_ORDER_API_SECRET: ${MVP_TESTNET_ORDER_API_SECRET:-}
  # The MAINTENANCE-lane tick loop (`docs/proposals/SCHEDULER_LANE_SPLIT_V0.1.md`): factory,
  # null_control, candle archive, analysis, prune, rotate, report, propose, data review —
  # every kind whose lateness costs freshness rather than money. Its fires are the long ones
  # (a factory fetch+ablation morning runs minutes), which is exactly why they live in a
  # process the risk lane never waits on.
  #
  # Its env is the AUDITED consumer set and nothing more (SCHEDULER_LANE_SPLIT_V0.1 §4):
  # collection selectors for the factory/null_control legs, the archive's own venue axis,
  # and outbound-only notification. NO venue account or order key, NO MVP_LIVE_*, NO model
  # credential — the service that runs 6-minute fires does not sit next to money. The drift
  # gate (`tests/test_deployment_env_passthrough.py`) pins every one of these absences.
  #
  # The pipeline-worker deploy-order rule on the scheduler service applies here unchanged —
  # since the lane split it is THIS lane whose analysis_task/report/propose/data_review
  # fires delegate into the worker, so `pipeline-worker` must never be OLDER than this
  # service either. A whole-project `compose up -d` satisfies it by construction.
  scheduler-maint:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-scheduler-maint
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
      - ${THOMAS_CORE_ACTIVATIONS_DIR:-./THOMAS_CORE/activations}:/app/THOMAS_CORE/activations:ro
      - ${THOMAS_CORE_APPROVALS_DIR:-./THOMAS_CORE/approvals}:/app/THOMAS_CORE/approvals:ro
    # Its own heartbeat, probed by its own name: a shared file would let this loop keep a
    # dead risk loop reading FRESH (or the reverse). Same thresholds as its sibling.
    healthcheck:
      test: ["CMD", "python", "-m", "runtime.mvp_runtime.heartbeat_cli", "scheduler-maintenance"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    command:
      - python
      - -m
      - runtime.mvp_runtime.scheduler_cli
      - tick
      - --lane
      - maintenance
      - --max-ticks
      - "0"
      - --interval-seconds
      - "30"
    environment:
      # The collection selectors the factory and null_control fires read in-process
      # (`select_market_data_collector` / `select_liquidation_feed`). Same fail-closed
      # shape as everywhere: env alone selects, unset = the inert mock.
      MVP_MARKET_DATA: ${MVP_MARKET_DATA:-}
      MVP_LIQUIDATION_FEED: ${MVP_LIQUIDATION_FEED:-}
      COINALYZE_API_KEY: ${COINALYZE_API_KEY:-}
      # The candle archive's own venue axis, moved here from the scheduler service with the
      # lane split — the archive fire is a maintenance kind. The whole gate is this line
      # (env-only since #496): an unforwarded name does not fail loudly, it archives nothing
      # while reading as configured on the host, which is the failure that got it written
      # down the first time.
      MVP_CANDLE_ARCHIVE: ${MVP_CANDLE_ARCHIVE:-}
      # Outbound-only notification, exactly like the risk lane: this loop TELLS Thomas when
      # a schedule fails, recovers, or was left overdue while it was down. It never reads
      # inbound messages, so the shared-bot token swap below is as safe here as there — and
      # both lanes de-dup their own alerts, so a shared failure alerts once per lane, which
      # is honest: two loops, two restarts, two diagnoses.
      MVP_OPERATOR_CHANNEL: ${MVP_OPERATOR_CHANNEL:-}
      TELEGRAM_BOT_TOKEN: ${HERMES_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      # The CONTROL bot's token, a second time and under another name (WMR-1, Thomas 2026-10-25,
      # WEEKLY_MANAGEMENT_REPORT_V0.1.md Q1=A). Only the weekly management report reads it
      # (`operator.select_control_channel`), send-only: the operator is that bot's one poller.
      # The interpolation source is the same `TELEGRAM_BOT_TOKEN` this service already draws as
      # its fallback above, so the set of services that hold the control bot does not change.
      MVP_CONTROL_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # The holdings board's Toss Securities account read (P1-b of MULTI_ASSET_EXPANSION_V0.1.md;
      # KIS replaced by Toss, Thomas 2026-10-07). The `holdings_refresh` fire is a maintenance kind,
      # and this lane — not the risk lane — holds the key, so a brokerage key never sits next to the
      # Binance order key. The client can also order (Toss has no read-only scope); the feed has no
      # order method and reaches only the token endpoint and four reads. This lane is the client's
      # one token issuer (Toss revokes the previous token on every issuance). Unset = the inert feed.
      MVP_TOSS_ACCOUNT: ${MVP_TOSS_ACCOUNT:-}
      TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:-}
      TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:-}
      TOSS_ACCOUNT_SEQ: ${TOSS_ACCOUNT_SEQ:-}
      # The holdings board's Binance spot + Simple Earn read (appendix C of MULTI_ASSET_EXPANSION_V0.1.md,
      # Thomas 2026-10-07). Its gate only. The account key pair it was first given (option A) was
      # REMOVED from this lane (H1-a, Thomas 2026-10-07): it is the very key the order credentials are
      # set from (checked by fingerprint equality in H0), so read-only code did not make it a read-only
      # key. This lane receives no trading-capable credential. The wallet read stays off until a
      # dedicated venue read-only key exists (H1-b); with the gate on and no key it fails closed
      # (NO_API_KEY), which the combined total reads as incomplete.
      MVP_BINANCE_WALLET: ${MVP_BINANCE_WALLET:-}
      # Wallet activation (Thomas 2026-10-08, after H2-H4): the dedicated read-only pair (H1-b, "Enable
      # Reading" only, IP-restricted) — the only Binance credential this lane holds. Nothing falls back
      # from it to a trading key; the feed reaches four GET paths and has no order method.
      BINANCE_READ_API_KEY: ${BINANCE_READ_API_KEY:-}
      BINANCE_READ_API_SECRET: ${BINANCE_READ_API_SECRET:-}

  # Claude's own read door (Option C C6b prerequisite 1; design and decisions RD-1..RD-4, Thomas 2026-10-19:
  # docs/proposals/HOST_PRIVILEGE_SEPARATION_C6B_READ_DOOR_V0.1.md). The same read door under the `claude`
  # profile: two reads with projected replies, every answer logged. Its shape is the decision, pinned in
  # tests/test_claude_read_door_service.py:
  # - uid and gid are literals, never the ${MVP_BRIDGE_CLIENT_*} the other doors share, so the `claude`
  #   account (2101) reaches this door only (D-11 a1; the assistant, 10000, was retired 2026-10-25);
  # - the socket lives outside bridge/, the directory the retired assistant mounted;
  # - the state root is mounted read-only (f2); the request log is a host directory Claude cannot open (d2).
  # The host directories (THOMAS_CLAUDE_DOOR_DIR, default /var/lib/thomas-claude-door) exist before the first
  # start (root makes them, RD-4 step 2): sock/ 10001:2101 0750
  # (the door re-asserts group and mode), log/ 10001:10001 0700. A missing one is created root-owned by
  # Docker, and the door then refuses to listen rather than serving without its log.
  claude-read-bridge:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-claude-read-bridge
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state:ro
      - ${THOMAS_CLAUDE_DOOR_DIR:-/var/lib/thomas-claude-door}/sock:/claude-door
      - ${THOMAS_CLAUDE_DOOR_DIR:-/var/lib/thomas-claude-door}/log:/claude-door-log
    healthcheck:
      test: ["CMD", "test", "-S", "/claude-door/read.sock"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - python
      - -m
      - runtime.mvp_runtime.read_bridge_cli
      - --profile
      - claude
      - --socket
      - /claude-door/read.sock
      - --request-log
      - /claude-door-log/requests.jsonl
    group_add:
      - "2101"
    environment:
      MVP_BRIDGE_CLIENT_GID: "2101"
      MVP_BRIDGE_CLIENT_UID: "2101"

  # The model plane's engine (docs/proposals/CREDENTIAL_PLANE_SEPARATION_V0.1.md). This is
  # the process that runs `pipeline.run_task` for delegated fires and CLI runs, so it is where the
  # credential env lives: the model provider chain, the search key, and the Naver lane's
  # variables. Each provider's env var is its whole opt-in (the env-only gate, Thomas 2026-08-10;
  # no mounted grant behind it). Deliberately absent: everything from the money path — no
  # BINANCE_*, no MVP_LIVE_*, no venue or order key; the kinds this worker runs never reach it,
  # and `test_deployment_env_passthrough` pins that per variable.
  #
  # Its socket lives under `internal/`, and the two literals below pin its peers to the runtime's
  # own uid/gid (10001, the image's fixed user) — the scheduler lanes are its clients (the
  # assistant's dispatch door was too, until the doors were retired 2026-10-25), and SO_PEERCRED
  # is what refuses everything else. The worker refuses to listen at all without a uid allowlist.
  # Literals, not ${...} interpolations, so no host `.env` value can point its peers anywhere.
  pipeline-worker:
    image: thomas-agent-runtime
    build: .
    container_name: thomas-pipeline-worker
    restart: unless-stopped
    # A model run in flight deserves the operator/scheduler grace, not the doors' 10s: a
    # SIGTERM mid-analysis should let the task settle into the ledger where it can.
    stop_grace_period: 30s
    # Memory ceiling (Thomas decision Q15-b, 2026-09-03; PR5). The two scheduler lanes stay unlimited —
    # the money path is what the kernel's OOM killer must never pick — so every OTHER long-lived
    # process on this 3.8 GB host carries a ceiling and is the candidate instead. Idle footprint is
    # ~1–10 MB; the ceiling is sized for a model call plus a Naver research pass, not for idle.
    mem_limit: 1g
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${THOMAS_STATE_DIR:-./.runtime_governance_state}:/app/.runtime_governance_state
      # The pipeline will not bind a task without an active approved Core — the Core mounts
      # moved here from dispatch-bridge with the execution itself (#380's gotcha, relocated:
      # a BRIDGE_ERROR naming a THOMAS_CORE path means THESE mounts were dropped).
      - ${THOMAS_CORE_ACTIVATIONS_DIR:-./THOMAS_CORE/activations}:/app/THOMAS_CORE/activations:ro
      - ${THOMAS_CORE_APPROVALS_DIR:-./THOMAS_CORE/approvals}:/app/THOMAS_CORE/approvals:ro
      # The R8 controlled write's target (§J decision 2, Thomas 2026-08-30). The blog lane's package
      # files rendered here until that lane was retired (2026-10-26); the writer stays for the
      # CLI's `--write-output` run in this container. Same absolute-path rule
      # as THOMAS_STATE_DIR — deploys run compose from throwaway clean worktrees, so the
      # relative default would scatter packages across build directories. The dir must be
      # writable by uid 10001 (chown once at adoption; state_guard's rule, same reason).
      - ${THOMAS_WORKSPACE_DIR:-./workspace}:/app/workspace
    healthcheck:
      test: ["CMD", "test", "-S", "/app/.runtime_governance_state/internal/pipeline.sock"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - python
      - -m
      - runtime.mvp_runtime.pipeline_worker_cli
      # The two assurance policies, ON since 2026-08-24. Until then every task the dispatch
      # door forwarded — fifteen on record, including every blog draft — ran with AUTOMATIC
      # checks only, while the operator loop beside it had the second reviewer since R7.
      # `auto` and not `always`: it matches what the operator has been running, and spends the
      # extra specialist call on ORANGE/RED-risk work rather than on every request.
      - --independent-validation
      - auto
      # M3's single bounded regeneration (hard cap 1). Seven REVISE verdicts are on record and
      # all seven ended FINAL_BLOCKED waiting for someone to ask again — this is the flag that
      # closes that loop. Costs a second specialist call only on the runs that earn one.
      - --revise
    environment:
      # The engine's peers are the runtime itself — see the header comment for why these are
      # literals. No group_add: the socket's group is the process's own.
      MVP_BRIDGE_CLIENT_GID: "10001"
      MVP_BRIDGE_CLIENT_UID: "10001"
      # Model providers and search, moved verbatim from dispatch-bridge with the execution.
      MVP_HOSTED_PROVIDER: ${MVP_HOSTED_PROVIDER:-}
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MVP_OPENROUTER_MODEL: ${MVP_OPENROUTER_MODEL:-}
      # Same passthrough as the operator service (see its comment, 2026-08-30, including
      # the nine-day outage its "unset falls back" line caused): the Groq/Google slugs must
      # reach every service that opens the gate, or a retired vendor default can only be
      # fixed by rebuilding the image.
      MVP_GROQ_MODEL: ${MVP_GROQ_MODEL:-}
      MVP_HOSTED_MODEL: ${MVP_HOSTED_MODEL:-}
      MVP_VALIDATOR_PROVIDER: ${MVP_VALIDATOR_PROVIDER:-}
      # R8's writer, on THIS service only (§J decision 2, Thomas 2026-08-30): the blog lane's weekly
      # package rendered here until 2026-10-26; the CLI's `--write-output` still can. The loop services keep
      # their standing exclusion (test_deployment_env_passthrough's NOT_DEPLOYED carries
      # the reasoning). Unset = the dry-run writer, exactly the pre-decision lane.
      MVP_WORKSPACE_WRITER: ${MVP_WORKSPACE_WRITER:-}
      # Read-only web search (optional), same Safety-Flag Gate.
      MVP_SEARCH_TOOL: ${MVP_SEARCH_TOOL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Naver keyword research (optional): the `--naver-keywords` evidence of an analysis run. The
      # `research`/`content` kinds run HERE, so this service is where the credentials belong — the
      # only place they exist at all. (The runtime blog lane used them too, until 2026-10-26.)
      #
      # Unlike every other gate in this block, MVP_NAVER_RESEARCH is the WHOLE gate: there is
      # no mounted grant behind it (Thomas, 2026-08-09). Naming it here is therefore an
      # enablement path, not merely a passthrough, and the credentials below are what it
      # enables. The Search Ad secret signs against the AD ACCOUNT and reaches
      # campaign-management endpoints — it is not the read-only key its read-only use makes it
      # look like, which is why no assistant-facing service is given these.
      MVP_NAVER_RESEARCH: ${MVP_NAVER_RESEARCH:-}
      NAVER_SEARCHAD_CUSTOMER_ID: ${NAVER_SEARCHAD_CUSTOMER_ID:-}
      NAVER_SEARCHAD_API_KEY: ${NAVER_SEARCHAD_API_KEY:-}
      NAVER_SEARCHAD_SECRET_KEY: ${NAVER_SEARCHAD_SECRET_KEY:-}
      NAVER_APIHUB_KEY_ID: ${NAVER_APIHUB_KEY_ID:-}
      NAVER_APIHUB_KEY: ${NAVER_APIHUB_KEY:-}
