# Business-analysis evaluation set v0.1 (system review B3, 2026-09-25).
#
# Twenty-four ideas across sectors, each with the THEMES a competent analysis of it cannot leave
# out. A theme is met when any of its phrases appears in the analysis (summary, findings, risks,
# assumptions, recommendation, next actions, perspectives). That is a floor, not a grade: it catches
# an analysis that never mentions the obvious binding constraint, and it cannot tell a good paragraph
# from a bad one. Judging prose would need a second model call — a new use of model_invocation that
# needs Thomas's approval — so it is deliberately not here.
#
# Change an item only with a reason in the commit: the set is only a regression baseline while it
# stays the same set. Add items as v0.2 rather than editing these.
schema: business_analysis_eval.v0.1
