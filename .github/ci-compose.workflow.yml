# CI-only compose override (sequence 2, P11 preparation; acceptance A26 / A28). Layered on top of
# docker-compose.yml by .github/workflows/docker-image.yml to start the dispatch door WITH the
# workflow manager loop. Written while the deployment file deliberately did not (turning the
# manager on in production was a deploy decision, docs/DEPLOYMENT_PLAN_SEQUENCE2.md); since §5 of
# that plan the deployment file carries the same flag, and this override stays so the step keeps
# proving the v3 combination even if the flag is rolled back out of the deployment file.
# Nothing else is overridden; the peer gate, mounts and environment are the deployment's.
services:
  dispatch-bridge:
    command:
      - python
      - -m
      - runtime.mvp_runtime.dispatch_bridge_cli
      - --workflow-manager
