name: Option C C4 separation (throwaway runner)

# C4 of Option C (docs/proposals/HOST_PRIVILEGE_SEPARATION_C4_PLAN_V0.1.md): the deploy runner's accounts,
# files, sockets and units, tested under systemd on a GitHub-hosted runner that is thrown away after the job.
# Thomas 2026-10-17: D-8 = GitHub Actions throwaway runner, within the free allowance, NOT a required check
# (the five required checks are Thomas decision Q14, and this is not one); CR-8b = Python 3.12.13 from
# python-build-standalone x86_64, SHA256 pinned below. The harness is scripts/ops/deploy_runner_c4.py.
#
# Nothing here touches the project's host, its .env, its images or its keys. The trust files carry a key
# made on the runner for this job; the .env is a fake holding a sentinel that the leak sweep looks for.
# No repository secret is used.

on:
  pull_request:
    paths:
      - .github/workflows/option-c-c4-separation.yml
      - runtime/mvp_runtime/deploy_runner/**
      - runtime/mvp_runtime/socket_door.py
      - scripts/ops/deploy_runner*
      - scripts/ops/deploy_runner_units/**
      - schemas/deploy_*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: option-c-c4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c4:
    name: C4 separation (ubuntu-24.04, systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: systemd is PID 1 (otherwise C4 cannot run here — NOT_TESTED)
        run: |
          test "$(cat /proc/1/comm)" = systemd
          systemctl is-system-running || true

      - name: Synthetic signing keys, made on this runner and never leaving it
        run: |
          set -euo pipefail
          sudo install -d -m 700 /root/c4-keys
          for n in thomas attacker; do sudo ssh-keygen -q -t ed25519 -N "" -C c4-synthetic -f "/root/c4-keys/$n"; done
          echo "FP=$(sudo ssh-keygen -lf /root/c4-keys/thomas.pub | awk '{print $2}')" >> "$GITHUB_ENV"
          SHA="$(git rev-parse HEAD)"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"
          echo "INSTALL=/opt/thomas-deploy/${SHA}" >> "$GITHUB_ENV"

      # C6a (Thomas 2026-10-19): the install is the script Thomas runs on the production host — the interpreter
      # (its SHA256 checked before it is opened), the accounts, the files, the units — run here first.
      - name: Install with the C6a script (dry run, then for real)
        run: |
          set -euo pipefail
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ARGS=(--repo "$GITHUB_WORKSPACE" --sha "$SHA" --host-label c4-runner \
                --signer-fingerprint "$FP" --pubkey-file /root/c4-keys/thomas.pub)
          sudo python3 scripts/ops/deploy_runner_c6a.py install "${ARGS[@]}" --dry-run
          sudo python3 scripts/ops/deploy_runner_c6a.py install "${ARGS[@]}"
          sudo python3 scripts/ops/deploy_runner_c6a.py status

      - name: Run C4 (N-1..N-14 and the leak sweep) against that install
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            "${INSTALL}/venv/bin/python" -I -m scripts.ops.deploy_runner_c4 run --throwaway-runner --installed \
            --install-dir "${INSTALL}" --install-sha "${SHA}" --out "$RUNNER_TEMP/c4-out" \
            --measure-repo "$GITHUB_WORKSPACE"

      - name: Reverse it with the C6a script, and check nothing is left
        if: always()
        run: |
          set -euo pipefail
          sudo python3 scripts/ops/deploy_runner_c6a.py uninstall --backup /root/c6-backup-c4 --dry-run
          sudo python3 scripts/ops/deploy_runner_c6a.py uninstall --backup /root/c6-backup-c4
          sudo python3 scripts/ops/deploy_runner_c6a.py status --expect-absent
          echo "| C6A | uninstall left no account, path, socket or active unit | PASS | status --expect-absent |" \
            | sudo tee -a "$RUNNER_TEMP/c4-out/c4-results.md" > /dev/null

      - name: Results (kinds and codes only)
        if: always()
        run: |
          sudo cat "$RUNNER_TEMP/c4-out/c4-results.md" >> "$GITHUB_STEP_SUMMARY" || echo "no results written"
