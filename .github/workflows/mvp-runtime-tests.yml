name: MVP Runtime Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: MVP runtime pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.lock

      - name: Install dependencies
        run: python -m pip install -r requirements-validation.lock pytest pytest-xdist

      # The backup test's real age round trip (tests/test_ops_harness_backup.py) needs the binary;
      # without it that test skips, and linux allows no skip. Windows skips the bash script whole.
      - name: Install age for the backup encryption test
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends age

      - name: Activate an ephemeral Core for the test run
        shell: bash
        run: |
          git config user.email "ci-tests@thomas-agent.local"
          git config user.name "Thomas Agent CI"
          python scripts/ci_activate_core_for_tests.py

      # Parallel across the runner's cores (system review 1-7, 2026-09-25). This job is the longest
      # required check — ~6 min on ubuntu, ~12 min on windows — and every PR waits on it, again
      # after each update-branch under strict mode. Measured locally on 4 cores: 8m09s serial,
      # 1m55s with `-n 4`, same pass count. Order dependence that parallel runs could mask is
      # still caught: the nightly Full validation workflow runs the suite serially on both OSes.
      - name: Run MVP runtime test suite
        run: python -m pytest tests/ -q -n auto --junitxml=junit.xml

      # A skipped test and a passing test are the same character in `pytest -q`. If the
      # Core activation above ever stops taking effect, ~208 tests skip and the run stays
      # green; this is the step that makes that loud (scripts/check_test_skips.py).
      - name: Fail if the run skipped what CI must never skip
        run: python scripts/check_test_skips.py --junit junit.xml
