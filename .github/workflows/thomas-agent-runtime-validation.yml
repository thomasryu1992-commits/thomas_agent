name: Thomas Agent Full Repository Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    tags:
      - "v*"
      - "release-*"

permissions:
  contents: read

concurrency:
  group: thomas-full-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.lock

      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.lock pytest

      - name: Run full repository gate without writing evidence
        run: python scripts/run_repository_release_gate.py --full --check-only

      # The gate validates contracts and the frozen kernel; the enforcement code (safety
      # gate, kill switch, consumption, workspace confinement) lives in the MVP runtime
      # and is covered only by pytest. A release tag going green without ever executing
      # that suite was a QA finding — full validation now means both.
      #
      # The ephemeral Core matters here as much as in the PR pipeline: without it the
      # ~26 requires_local_core test files (binding, planning, the full pipeline — the
      # highest-value integration tests) silently SKIP, so "full validation" was
      # exercising strictly less than every PR run did.
      - name: Activate an ephemeral Core for the test run
        shell: bash
        run: |
          git config user.email "ci-tests@thomas-agent.local"
          git config user.name "Thomas Agent CI"
          python scripts/ci_activate_core_for_tests.py

      # The backup test's real age round trip (tests/test_ops_harness_backup.py) needs the binary;
      # without it that test skips, and linux allows no skip. Windows skips the bash script whole.
      - name: Install age for the backup encryption test
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends age

      - name: Run the MVP runtime test suite
        run: python -m pytest tests/ -q --junitxml=junit.xml

      # Same guard as the PR pipeline: a Core activation that silently did not take
      # effect turns ~208 integration tests into green skips. The check needs the junit
      # report above to have anything to read (scripts/check_test_skips.py).
      - name: Fail if the run skipped what CI must never skip
        run: python scripts/check_test_skips.py --junit junit.xml
