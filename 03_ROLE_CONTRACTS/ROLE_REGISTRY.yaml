# conversation.frontdesk is non-dynamic BY DESIGN, not by convenience: it lives in front
# of the pipeline (session front), so Prime must never be able to route work to it. The
# dynamic-role rule "active => routable" is correct for specialists and would force this
# role routable the day it activates — non-dynamic placement removes that contradiction
# structurally. Its definition hash is pinned like a dynamic role's, and the consistency
# validator enforces routable: false permanently (the thomas.prime precedent).
- role_id: conversation.frontdesk
  role_type: session_front
  status: active          # D2 flip: explicit Thomas decision, 2026-07-25 (F2 runtime PR)
  routable: false
