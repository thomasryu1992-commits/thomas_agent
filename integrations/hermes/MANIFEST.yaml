# Compatibility manifest for the Hermes <-> Thomas integration (sequence 2, P02, 2026-09-14).
# The record a deploy compares against: which shim files, prompt and runtime were measured together.
# Nothing here is enforced by code; scripts/ops/install_hermes_shims.sh --check compares the host copy
# of the shims with integrations/hermes/mcp, and this file says what that copy was measured with.
manifest_version: 1
measured_at: "2026-09-14"
measured_on: deployment host (hermes container up since 2026-09-08; Thomas services healthy)
door_api:
  proto: 2
  design_record: docs/runtime-contracts/DOOR_API_V2_DESIGN_V0.1.md
  decision_record: docs/HERMES_ORCHESTRATOR_ARCHITECTURE_V0.2.md
  v3_workflow_commands: served by a runtime with P05 (#857) on a dispatch door started with --workflow-manager; capabilities lookup first, server before shim
thomas_runtime:
  main_commit: a789bec            # origin/main at measurement (before P00/P01 merged)
  running_image_checkout: d5de6fa # what the running thomas-agent-runtime image was built from
  running_image_differs_from_main: [runtime/mvp_runtime/crypto/pool.py, runtime/mvp_runtime/crypto/feedback.py, scripts/promote_memory_candidate.py]
  policy_version: "1.5.0"
  schemas:
    task_registry_entry: v0.2
    task: v0.3
hermes:
  image: hermes-agent:latest
  image_id: sha256:5539d8870610a83a0bc76d34320719251f33792514737e2888e990903add1e4c
  image_created: "2026-07-30T08:35:49Z"
  build_context: /root/hermes-trial/hermes-agent
  build_context_commit: 9accf79
  uid: 10000
  state_root: /root/hermes-trial/data
  mcp_dir: /root/hermes-trial/data/mcp
  mount_into_container: /opt/data          # the gateway spawns /opt/data/mcp/<shim>.py
shims:
  version: "2.4"   # 2.2 = the 2026-09-07 switch-shim revision (bak-pre-v2.2 on the host); 2.3 = the read shim's [data] line (P02); 2.4 = the dispatch shim's door API v3 workflow tools (P05, 2026-09-14)
  runtime_requirement: every door speaks proto 2 (candidate-833 or later)
  full_data_requirement: crypto_readiness / crypto_funds carry their view only from the runtime that includes P02 (readiness_data, funds_data); an older runtime answers `{action}` and the line still renders
  v3_requirement: the workflow tools need a runtime that includes P05 AND a dispatch-bridge started with --workflow-manager; any other door refuses them as WORKFLOW_UNAVAILABLE (thomas_capabilities says which)
  host_state: the host still runs 2.2 until scripts/ops/install_hermes_shims.sh --install runs after the runtime deploy
  files:
    thomas_door_client.py: 19b2ec0e92ed51082fb814b505b44e4469ccbf460bbeded5dab4487c76e36d4f
    read_bridge_mcp.py: 4389db33a860f8e1c3abca54aeadc94ed6cf0d0cb9723401150c547d25c9e80f
    dispatch_bridge_mcp.py: d399ee6ed4c4ec120b5e284b56a53592ea7f34275a357e6a3a94c9a7612cf8d9
    switch_bridge_mcp.py: fc6fc597958afa72c6968637637e63f58f20d8b2f29e82ed88d5fa9e1b430768
    knowledge_bridge_mcp.py: c3d44c341f264008bdfa2346c85b460ce8a63bc7589d2173088d210314fa3326
prompts:
  soul: config/SOUL.md                       # no version field of its own; measured 2026-09-14
  skill: config/skills/thomas-ops/SKILL.md
  skill_version: "1.4.1"
templates:
  config: config/config.template.yaml        # operator Telegram ids replaced by ${HERMES_HOME_CHAT_ID} / ${HERMES_HOME_USER_ID}
  cron_jobs: config/cron-jobs.template.json  # delivery target replaced by ${HERMES_DELIVER_TARGET}; run state omitted
not_versioned:
  - the container environment (three values from .env; docs/DEPLOYMENT.md)
  - sessions, memories, state.db and its snapshots, auth.json, logs, caches
  - the hermes-agent build context itself (another repository)
