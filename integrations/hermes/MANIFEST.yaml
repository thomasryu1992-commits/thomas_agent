# Compatibility manifest for the Hermes <-> Thomas integration (sequence 2, P02, 2026-09-14).
# The record a deploy compares against: which shim files, prompt and runtime were measured together.
# Nothing here is enforced by code; scripts/ops/install_hermes_shims.sh --check compares the host copy
# of the shims with integrations/hermes/mcp, and this file says what that copy was measured with.
manifest_version: 1
measured_at: "2026-09-14"
measured_on: deployment host (hermes container up since 2026-09-08; Thomas services healthy)
door_api:
  proto: 2
  design_record: docs/runtime-contracts/DOOR_API_V2_DESIGN_V0.1.md
  decision_record: docs/HERMES_ORCHESTRATOR_ARCHITECTURE_V0.2.md
  v3_workflow_commands: served by a runtime with P05 (#857) on a dispatch door started with --workflow-manager; capabilities lookup first, server before shim
thomas_runtime:
  main_commit: a789bec            # origin/main at measurement (before P00/P01 merged)
  running_image_checkout: d5de6fa # what the running thomas-agent-runtime image was built from
  running_image_differs_from_main: [runtime/mvp_runtime/crypto/pool.py, runtime/mvp_runtime/crypto/feedback.py, scripts/promote_memory_candidate.py]
  policy_version: "1.5.0"
  schemas:
    task_registry_entry: v0.2
    task: v0.3
hermes:
  image: hermes-agent:latest
  image_id: sha256:5539d8870610a83a0bc76d34320719251f33792514737e2888e990903add1e4c
  image_created: "2026-07-30T08:35:49Z"
  build_context: /root/hermes-trial/hermes-agent
  build_context_commit: 9accf79
  uid: 10000
  state_root: /root/hermes-trial/data
  mcp_dir: /root/hermes-trial/data/mcp
  mount_into_container: /opt/data          # the gateway spawns /opt/data/mcp/<shim>.py
shims:
  version: "2.14"  # 2.2 = the 2026-09-07 switch-shim revision (bak-pre-v2.2 on the host); 2.3 = the read shim's [data] line (P02); 2.4 = the dispatch shim's door API v3 workflow tools (P05); 2.5 = retry_workflow_step (P06); 2.6 = propose_workflow_update (P07); 2.7 = workflow_changes + report_workflow_usage (P08); 2.8 = propose_schedule_change (P09; refused by the runtime until policy 1.6.0); 2.9 = the V2_INTAKE_CLOSED cutover rendering (P10); 2.10 = review fixes — a mutation sent without a reply is UNCONFIRMED, reported cost keeps billed rows (2026-09-14); 2.11 = trading_readiness defines live_entry_possible as readiness_data computes it — its four [data] fields, the execution stage and the venue contract included (2026-09-19); 2.12 = trading_readiness reads live_entry_possible off the readiness state's own lists — readiness.components / blocking / unknown — and the board it describes opens and closes with LIVE ENTRY POSSIBLE (crypto PR5a/5b, 2026-09-19); 2.13 = the switch shim's halt_trading tool (disable mode=soft|hard: soft since policy 1.5.1, hard since PR6a) and a disable note that no longer tells the model a halt stopped position management (crypto PR6e, 2026-09-19); 2.14 = request_emergency_close, the assistant's ask for the emergency close (switch door `emergency_close`, dormant until policy 1.5.2 lists it; crypto PR6e, 2026-09-19)
  runtime_requirement: every door speaks proto 2 (candidate-833 or later); halt_trading (2.13) needs policy 1.5.1 for soft, PR6a for hard and PR6d for a halt recorded under a stop — an older runtime refuses by name or changes nothing, and the shim says so; request_emergency_close (2.14) needs a runtime with PR6e, and policy 1.5.2 for the door to act on it — before that the door refuses it by name
  full_data_requirement: crypto_readiness / crypto_funds carry their view only from the runtime that includes P02 (readiness_data, funds_data); an older runtime answers `{action}` and the line still renders
  v3_requirement: the workflow tools need a runtime that includes P05 AND a dispatch-bridge started with --workflow-manager; any other door refuses them as WORKFLOW_UNAVAILABLE (thomas_capabilities says which)
  host_state: as of 2026-09-19 the host runs 2.10 (installed 2026-09-15 03:46Z, gateway restarted 03:47Z; byte-identical to the 2.10 files on 2026-09-19); 2.11 and 2.12 wait for scripts/ops/install_hermes_shims.sh --install and a gateway restart (operator step; install 2.12 only on a runtime with PR5a, whose [data] carries `readiness`). --check is the live answer, not this line
  files:
    thomas_door_client.py: 19b2ec0e92ed51082fb814b505b44e4469ccbf460bbeded5dab4487c76e36d4f
    read_bridge_mcp.py: 7d10be17440467d8b62474de5208f87cdbea35ca9f24ce60dbffb49888791470
    dispatch_bridge_mcp.py: 20ae1e24eb82fa13b3710b82cf3c32ee8d80f9fa0caf4495c05458a95821f667
    switch_bridge_mcp.py: eee9d690ccd98baa63157b07c36b24131c2a36fb1cea755674abd6d5223e64da
    knowledge_bridge_mcp.py: c3d44c341f264008bdfa2346c85b460ce8a63bc7589d2173088d210314fa3326
prompts:
  soul: config/SOUL.md                       # no version field of its own; measured 2026-09-14; halt_trading added with shim 2.13 and request_emergency_close with 2.14 (PR6e, 2026-09-19)
  skill: config/skills/thomas-ops/SKILL.md
  skill_version: "1.5.5"                     # §6 cutover note, §7 items 8–13 (P07–P10) and the review fixes
templates:
  config: config/config.template.yaml        # operator Telegram ids replaced by ${HERMES_HOME_CHAT_ID} / ${HERMES_HOME_USER_ID}
  cron_jobs: config/cron-jobs.template.json  # delivery target replaced by ${HERMES_DELIVER_TARGET}; run state omitted; the fourth job (워크플로 서술, P08) is not on the host until installed with the 2.7 shims
not_versioned:
  - the container environment (three values from .env; docs/DEPLOYMENT.md)
  - sessions, memories, state.db and its snapshots, auth.json, logs, caches
  - the hermes-agent build context itself (another repository)
